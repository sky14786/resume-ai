<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Beige background -->
  <rect width="1200" height="630" fill="#faf9f6"/>

  <!-- Outer thick frame -->
  <rect x="18" y="18" width="1164" height="594" fill="none" stroke="#0c0c0c" stroke-width="5"/>

  <!-- Lime left panel -->
  <rect x="18" y="18" width="462" height="594" fill="#a3e635"/>

  <!-- Big initials on lime -->
  <text x="249" y="230" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="190" font-weight="900" fill="#0c0c0c" letter-spacing="-10">JY</text>

  <!-- Role label below initials -->
  <text x="249" y="278" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="13" fill="#0c0c0c" letter-spacing="4">BACKEND ENGINEER</text>

  <!-- Horizontal rule on lime -->
  <rect x="85" y="296" width="330" height="3" fill="#0c0c0c"/>

  <!-- Stat boxes on lime — brutalist style -->
  <!-- 5+ yrs -->
  <rect x="92" y="316" width="115" height="78" fill="#0c0c0c"/>
  <rect x="88" y="312" width="115" height="78" fill="#faf9f6" stroke="#0c0c0c" stroke-width="3"/>
  <text x="100" y="356" font-family="'Courier New', Courier, monospace" font-size="32" font-weight="900" fill="#0c0c0c">5+</text>
  <text x="100" y="377" font-family="'Courier New', Courier, monospace" font-size="9" fill="#555" letter-spacing="2">YEARS</text>

  <!-- 100만+ -->
  <rect x="228" y="316" width="115" height="78" fill="#0c0c0c"/>
  <rect x="224" y="312" width="115" height="78" fill="#faf9f6" stroke="#0c0c0c" stroke-width="3"/>
  <text x="236" y="349" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="900" fill="#0c0c0c">100만+</text>
  <text x="236" y="377" font-family="'Courier New', Courier, monospace" font-size="9" fill="#555" letter-spacing="2">USERS</text>

  <!-- 350+ -->
  <rect x="366" y="316" width="97" height="78" fill="#0c0c0c"/>
  <rect x="362" y="312" width="97" height="78" fill="#faf9f6" stroke="#0c0c0c" stroke-width="3"/>
  <text x="374" y="356" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="900" fill="#0c0c0c">350+</text>
  <text x="374" y="377" font-family="'Courier New', Courier, monospace" font-size="9" fill="#555" letter-spacing="2">SERVERS</text>

  <!-- URL on lime -->
  <text x="249" y="572" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="12" fill="#0c0c0c" opacity="0.7" letter-spacing="1">juneyoung.pages.dev</text>

  <!-- Right side: name block -->
  <!-- "JuneYoung" -->
  <text x="515" y="270"
    font-family="'Arial Black', 'Arial Bold', Impact, sans-serif"
    font-size="86" font-weight="900" fill="#0c0c0c">JuneYoung</text>

  <!-- "Kim." in lime -->
  <text x="515" y="362"
    font-family="'Arial Black', 'Arial Bold', Impact, sans-serif"
    font-size="86" font-weight="900" fill="#a3e635">Kim.</text>

  <!-- Decorative underline -->
  <rect x="515" y="380" width="5" height="30" fill="#0c0c0c"/>
  <rect x="526" y="393" width="520" height="4" fill="#0c0c0c"/>

  <!-- Description -->
  <text x="515" y="440"
    font-family="'Courier New', Courier, monospace"
    font-size="15" fill="#444">혼자서 시스템 전체를 책임지는 엔지니어.</text>
  <text x="515" y="462"
    font-family="'Courier New', Courier, monospace"
    font-size="14" fill="#888">Kafka · PostgreSQL · Docker · Spring Boot</text>
</svg>
