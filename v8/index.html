<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JuneYoung Kim — Terminal Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="crt-overlay"></div>

  <div class="terminal-window">
    <div class="terminal-titlebar">
      <div class="titlebar-buttons">
        <span class="btn-close"></span>
        <span class="btn-min"></span>
        <span class="btn-max"></span>
      </div>
      <div class="titlebar-title">JuneYoung Kim — Backend Engineer v1.0.0</div>
      <div class="titlebar-spacer"></div>
    </div>

    <div class="terminal-body" id="terminalBody">
      <div id="output"></div>

      <div class="input-line" id="inputLine">
        <span class="prompt">juneyoung@portfolio:~$&nbsp;</span>
        <div class="input-wrapper">
          <span class="input-display" id="inputDisplay"></span>
          <span class="cursor" id="cursor"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden real input for mobile keyboard support -->
  <input
    type="text"
    id="hiddenInput"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    aria-hidden="true"
    tabindex="-1"
  />

  <script src="script.js"></script>
</body>
</html>
